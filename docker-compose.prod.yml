services:
  db:
    ports: !reset []

  agent-api:
    ports: !reset []

  agent-web:
    ports: !reset []

  caddy:
    image: caddy:alpine
    container_name: a20_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - agent-web

volumes:
  caddy_data:
  caddy_config:
