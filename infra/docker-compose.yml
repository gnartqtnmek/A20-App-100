# Local development stack for the LMS + AI Agent project.
#
#   make dev      # bring everything up
#   make down     # stop and remove
#   make logs     # tail logs
#
# Services:
#   postgres   — relational + pgvector for embeddings
#   redis      — short-term memory cache + Celery broker
#   minio      — S3-compatible object storage for file uploads
#   minio-init — one-shot job that creates the default bucket
#   backend    — FastAPI LMS API (port 8000)
#   agent      — AI Agent service (port 8001) — Sprint 4+ wires the HTTP API
#
# Frontend (Next.js) intentionally NOT in compose — easier to run via
# ``npm run dev`` on the host so HMR works natively.

name: lms-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms
      POSTGRES_DB: lms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lms-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: lms-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minio minio12345 &&
        mc mb -p local/lms-uploads || true &&
        mc anonymous set download local/lms-uploads || true &&
        echo 'MinIO bucket ready';
      "

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: lms-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://lms:lms@postgres:5432/lms
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      S3_BUCKET: lms-uploads
      JWT_SECRET: dev-secret-do-not-use-in-prod
      CORS_ORIGINS: http://localhost:3000
      AGENT_SERVICE_URL: http://agent:8001
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  agent:
    build:
      context: ../agent
      dockerfile: Dockerfile
    container_name: lms-agent
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-claude-sonnet-4-20250514}
      DATABASE_URL: postgresql+psycopg://lms:lms@postgres:5432/lms
      REDIS_URL: redis://redis:6379/0
      LMS_API_URL: http://backend:8000
      LOG_LEVEL: INFO
    ports:
      - "8001:8001"
    volumes:
      - ../agent:/app
    command: ["python", "-m", "agent.agent"]
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  redis_data:
  minio_data:
