# Alembic configuration for the LMS backend.
#
# Run inside ``backend/``:
#   alembic upgrade head           # apply all migrations
#   alembic revision --autogenerate -m "msg"
#   alembic downgrade -1
#
# The DSN is read from the ``DATABASE_URL`` env var by ``migrations/env.py``,
# so we do not hard-code it here.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

# Filename template for new revision files. Timestamp + slug avoids clashes
# when multiple developers create migrations in parallel.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
